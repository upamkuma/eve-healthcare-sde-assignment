services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eve_healthcare
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://eve:eve_password@db:5432/eve_healthcare
      SECRET_KEY: change-this-to-a-long-random-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
